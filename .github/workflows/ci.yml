name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact:
    name: Compact compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Downloaded to a file rather than piped into sh: in a pipeline the shell
      # reports sh's status, so a failed download used to pass this step and
      # surface later as "compact: command not found".
      - name: Install the Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf --retry 5 --retry-all-errors \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh \
            -o "$RUNNER_TEMP/compact-installer.sh"
          sh "$RUNNER_TEMP/compact-installer.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update the toolchain
        run: compact update

      - name: Report versions
        run: |
          compact --version
          compact compile --version

      - name: Check contract formatting
        run: compact format --check packages/contract/src/aequira.compact

      # Compiles to a temporary directory so the tracked src/managed/ output is
      # never overwritten by CI.
      - name: Compile circuits
        run: compact compile packages/contract/src/aequira.compact "$RUNNER_TEMP/managed-ci"

      - name: Verify the generated circuits and keys
        run: |
          cd "$RUNNER_TEMP/managed-ci"
          for circuit in apply commitScore openApplications openReveal openReview registerApplicant registerReviewer revealScore; do
            test -s "keys/$circuit.prover"
            test -s "keys/$circuit.verifier"
            test -s "zkir/$circuit.zkir"
            echo "ok $circuit"
          done

  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
